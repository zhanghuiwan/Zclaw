<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zclaw Gateway Chat</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a2e;
            color: #eee;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            background: #16213e;
            padding: 12px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #0f3460;
        }

        .header h1 {
            font-size: 18px;
            color: #00d9ff;
        }

        .status {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #666;
        }

        .status-dot.connected {
            background: #00ff88;
        }

        .status-dot.connecting {
            background: #ffaa00;
            animation: pulse 1s infinite;
        }

        .status-dot.disconnected {
            background: #ff4444;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .message {
            display: flex;
            gap: 12px;
            max-width: 80%;
        }

        .message.user {
            align-self: flex-end;
            flex-direction: row-reverse;
        }

        .message.assistant {
            align-self: flex-start;
        }

        .avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: #0f3460;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            flex-shrink: 0;
        }

        .message.user .avatar {
            background: #00d9ff;
        }

        .message-content {
            background: #16213e;
            padding: 12px 16px;
            border-radius: 12px;
            line-height: 1.5;
        }

        .message.user .message-content {
            background: #0f3460;
        }

        .message-content pre {
            background: #0a0a1a;
            padding: 12px;
            border-radius: 8px;
            overflow-x: auto;
            margin: 8px 0;
            font-size: 13px;
        }

        .message-content code {
            background: #0a0a1a;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 13px;
        }

        .message-content pre code {
            background: transparent;
            padding: 0;
        }

        .tool-card {
            background: #0f3460;
            border-radius: 8px;
            margin: 8px 0;
            overflow: hidden;
        }

        .tool-header {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            background: #1a1a2e;
        }

        .tool-name {
            color: #00d9ff;
            font-weight: 500;
        }

        .tool-status {
            font-size: 12px;
            color: #888;
        }

        .tool-status.running {
            color: #ffaa00;
        }

        .tool-status.success {
            color: #00ff88;
        }

        .tool-status.error {
            color: #ff4444;
        }

        .input-area {
            background: #16213e;
            padding: 16px 20px;
            border-top: 1px solid #0f3460;
            display: flex;
            gap: 12px;
            align-items: flex-end;
        }

        textarea {
            flex: 1;
            background: #1a1a2e;
            border: 1px solid #0f3460;
            border-radius: 8px;
            padding: 12px 16px;
            color: #eee;
            font-size: 14px;
            font-family: inherit;
            resize: none;
            min-height: 48px;
            max-height: 200px;
        }

        textarea:focus {
            outline: none;
            border-color: #00d9ff;
        }

        button {
            background: #00d9ff;
            color: #1a1a2e;
            border: none;
            border-radius: 8px;
            padding: 12px 20px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background: #00b8d9;
        }

        button:disabled {
            background: #333;
            color: #666;
            cursor: not-allowed;
        }

        .welcome {
            text-align: center;
            padding: 60px 20px;
            color: #888;
        }

        .welcome h2 {
            font-size: 24px;
            color: #00d9ff;
            margin-bottom: 12px;
        }

        .token-info {
            font-size: 12px;
            color: #666;
            margin-top: 8px;
        }

        .permission-dialog {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .permission-dialog.hidden {
            display: none;
        }

        .permission-content {
            background: #16213e;
            border: 2px solid #ffaa00;
            border-radius: 12px;
            padding: 24px;
            max-width: 500px;
            width: 90%;
        }

        .permission-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
            font-size: 18px;
            font-weight: bold;
            color: #ffaa00;
        }

        .permission-body {
            margin-bottom: 20px;
        }

        .permission-tool {
            font-size: 16px;
            color: #00d9ff;
            margin-bottom: 12px;
        }

        .permission-args {
            background: #0a0a1a;
            padding: 12px;
            border-radius: 8px;
            font-size: 13px;
            color: #ccc;
            max-height: 200px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-break: break-all;
        }

        .permission-actions {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
        }

        .perm-btn {
            padding: 10px 24px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            border: none;
        }

        .perm-btn.deny {
            background: #ff4444;
            color: white;
        }

        .perm-btn.allow {
            background: #00ff88;
            color: #1a1a2e;
        }

        .perm-btn:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Zclaw Gateway Chat</h1>
        <div class="status">
            <span class="status-dot disconnected" id="statusDot"></span>
            <span id="statusText">未连接</span>
        </div>
    </div>

    <div class="chat-container" id="chatContainer">
        <div class="welcome">
            <h2>🦀 Zclaw Gateway</h2>
            <p>连接到 Gateway 开始对话</p>
            <p style="margin-top: 8px; font-size: 12px;">ws://127.0.0.1:8080/api/ws/gateway</p>
        </div>
    </div>

    <div class="input-area">
        <textarea id="input" placeholder="输入消息..." rows="1" disabled></textarea>
        <button id="sendBtn" disabled>发送</button>
    </div>

    <!-- Permission Dialog -->
    <div class="permission-dialog hidden" id="permissionDialog">
        <div class="permission-content">
            <div class="permission-header">
                <span id="permIcon">⚠️</span>
                <span id="permTitle">权限请求</span>
            </div>
            <div class="permission-body">
                <div class="permission-tool" id="permToolName">tool_name</div>
                <pre class="permission-args" id="permArgs"></pre>
            </div>
            <div class="permission-actions">
                <button class="perm-btn deny" id="permDeny">拒绝</button>
                <button class="perm-btn allow" id="permAllow">允许</button>
            </div>
        </div>
    </div>

    <script>
        const wsUrl = 'ws://127.0.0.1:8080/api/ws/gateway';
        const container = document.getElementById('chatContainer');
        const input = document.getElementById('input');
        const sendBtn = document.getElementById('sendBtn');
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');

        let ws = null;
        let connected = false;
        let generating = false;
        let currentContent = '';
        let pendingPermission = null;  // 待处理的权限请求

        function connect() {
            if (ws) ws.close();

            updateStatus('connecting');
            ws = new WebSocket(wsUrl);

            ws.onopen = () => {
                connected = true;
                updateStatus('connected');
                input.disabled = false;
                sendBtn.disabled = false;
                clearWelcome();
            };

            ws.onclose = () => {
                connected = false;
                updateStatus('disconnected');
                input.disabled = true;
                sendBtn.disabled = true;
                ws = null;
            };

            ws.onerror = () => {
                updateStatus('disconnected');
            };

            ws.onmessage = (event) => {
                const msg = JSON.parse(event.data);
                handleMessage(msg);
            };
        }

        function updateStatus(status) {
            statusDot.className = 'status-dot ' + status;
            const labels = {
                connected: '已连接',
                disconnected: '未连接',
                connecting: '连接中...'
            };
            statusText.textContent = labels[status] || status;
        }

        function clearWelcome() {
            const welcome = container.querySelector('.welcome');
            if (welcome) welcome.remove();
        }

        function escapeHtml(str) {
            if (!str) return '';
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        function simpleMarkdown(text) {
            if (!text) return '';
            let html = escapeHtml(text);

            // Code blocks
            html = html.replace(/```(\w*)\n?([\s\S]*?)```/g, (_, lang, code) => {
                return `<pre><code>${code.trim()}</code></pre>`;
            });

            // Inline code
            html = html.replace(/`([^`]+)`/g, '<code>$1</code>');

            // Bold
            html = html.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');

            // Italic
            html = html.replace(/\*([^*]+)\*/g, '<em>$1</em>');

            // Headers
            html = html.replace(/^### (.+)$/gm, '<h4>$1</h4>');
            html = html.replace(/^## (.+)$/gm, '<h3>$1</h3>');
            html = html.replace(/^# (.+)$/gm, '<h2>$1</h2>');

            // Newlines
            html = html.replace(/\n/g, '<br>');

            return html;
        }

        function handleMessage(msg) {
            const { type, data } = msg;

            switch (type) {
                case 'stream_delta':
                    currentContent += data.content || '';
                    updateAssistantMessage();
                    break;

                case 'tool_start':
                    addToolCard(data.id, data.name, 'running');
                    break;

                case 'tool_end':
                    updateToolCard(data.id, data.name, data.success ? 'success' : 'error', data.error);
                    break;

                case 'loop_start':
                    // A new loop round started
                    break;

                case 'usage':
                    updateTokenInfo(data);
                    break;

                case 'done':
                    generating = false;
                    input.disabled = false;
                    sendBtn.textContent = '发送';
                    currentContent = '';
                    break;

                case 'error':
                    addMessage('assistant', `错误: ${data.message}`);
                    generating = false;
                    input.disabled = false;
                    sendBtn.textContent = '发送';
                    currentContent = '';
                    break;

                case 'permission':
                    // 显示权限确认对话框
                    pendingPermission = {
                        tool_call_id: data.tool_call_id,
                        tool_name: data.tool_name,
                        arguments: data.arguments,
                        danger_level: data.danger_level,
                    };
                    showPermissionDialog(data);
                    break;
            }
        }

        function showPermissionDialog(data) {
            const dialog = document.getElementById('permissionDialog');
            const permIcon = document.getElementById('permIcon');
            const permTitle = document.getElementById('permTitle');
            const permToolName = document.getElementById('permToolName');
            const permArgs = document.getElementById('permArgs');

            if (data.danger_level === 'dangerous') {
                permIcon.textContent = '🚨';
                permTitle.textContent = '危险操作需要确认';
                permTitle.style.color = '#ff4444';
            } else {
                permIcon.textContent = '⚠️';
                permTitle.textContent = '操作需要确认';
                permTitle.style.color = '#ffaa00';
            }

            permToolName.textContent = data.tool_name;
            permArgs.textContent = JSON.stringify(data.arguments, null, 2);

            dialog.classList.remove('hidden');
        }

        function hidePermissionDialog() {
            const dialog = document.getElementById('permissionDialog');
            dialog.classList.add('hidden');
            pendingPermission = null;
        }

        function sendPermissionResponse(allowed) {
            if (!pendingPermission || !ws) return;

            ws.send(JSON.stringify({
                type: 'permission_response',
                data: {
                    tool_call_id: pendingPermission.tool_call_id,
                    allowed: allowed,
                },
            }));

            hidePermissionDialog();
        }

        // 权限对话框按钮事件
        document.getElementById('permAllow').addEventListener('click', () => sendPermissionResponse(true));
        document.getElementById('permDeny').addEventListener('click', () => sendPermissionResponse(false));

        function addMessage(role, content) {
            const div = document.createElement('div');
            div.className = `message ${role}`;
            div.innerHTML = `
                <div class="avatar">${role === 'user' ? '👤' : '🦀'}</div>
                <div class="message-content">${role === 'user' ? escapeHtml(content).replace(/\n/g, '<br>') : simpleMarkdown(content)}</div>
            `;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }

        let assistantDiv = null;
        let tokenInfo = null;

        function startAssistantMessage() {
            assistantDiv = document.createElement('div');
            assistantDiv.className = 'message assistant';
            assistantDiv.innerHTML = `
                <div class="avatar">🦀</div>
                <div class="message-content"></div>
            `;
            container.appendChild(assistantDiv);
            currentContent = '';
        }

        function updateAssistantMessage() {
            if (!assistantDiv) startAssistantMessage();
            const content = assistantDiv.querySelector('.message-content');
            content.innerHTML = simpleMarkdown(currentContent);
            container.scrollTop = container.scrollHeight;
        }

        function addToolCard(id, name, status) {
            if (!assistantDiv) startAssistantMessage();
            const content = assistantDiv.querySelector('.message-content');

            const card = document.createElement('div');
            card.className = 'tool-card';
            card.id = `tool-${id}`;
            card.innerHTML = `
                <div class="tool-header">
                    <span>🔧</span>
                    <span class="tool-name">${escapeHtml(name)}</span>
                    <span class="tool-status ${status}">${status === 'running' ? '执行中...' : (status === 'success' ? '完成' : '失败')}</span>
                </div>
            `;
            content.appendChild(card);
            container.scrollTop = container.scrollHeight;
        }

        function updateToolCard(id, name, status, error) {
            const card = document.getElementById(`tool-${id}`);
            if (card) {
                const statusEl = card.querySelector('.tool-status');
                statusEl.className = `tool-status ${status}`;
                statusEl.textContent = status === 'success' ? '完成' : '失败';
            }
        }

        function updateTokenInfo(data) {
            if (!tokenInfo) {
                tokenInfo = document.createElement('div');
                tokenInfo.className = 'token-info';
                container.appendChild(tokenInfo);
            }
            tokenInfo.textContent = `Tokens: ${data.prompt_tokens} + ${data.completion_tokens} = ${data.total_tokens}`;
        }

        function send() {
            const text = input.value.trim();
            if (!text || !connected || generating) return;

            addMessage('user', text);
            input.value = '';
            generating = true;
            input.disabled = true;
            sendBtn.textContent = '取消';
            startAssistantMessage();

            ws.send(JSON.stringify({
                type: 'chat',
                data: { message: text, agent_id: 'default' }
            }));
        }

        function cancel() {
            if (ws && generating) {
                ws.send(JSON.stringify({ type: 'cancel', data: {} }));
                generating = false;
                input.disabled = false;
                sendBtn.textContent = '发送';
            }
        }

        sendBtn.addEventListener('click', () => {
            if (generating) {
                cancel();
            } else {
                send();
            }
        });

        input.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                send();
            }
        });

        input.addEventListener('input', () => {
            input.style.height = 'auto';
            input.style.height = Math.min(input.scrollHeight, 200) + 'px';
        });

        // Auto resize
        input.style.height = input.scrollHeight + 'px';

        // Connect on load
        connect();
    </script>
</body>
</html>
