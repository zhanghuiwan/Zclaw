version: "3.8"

services:
  zclaw-gateway:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.gateway
    container_name: zclaw-gateway
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # LLM 配置
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://api.openai.com/v1}
      - LLM_MODEL=${LLM_MODEL:-gpt-4o-mini}

      # Telegram 配置（可选）
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}

      # GitHub Webhook 密钥（可选）
      - GITHUB_WEBHOOK_SECRET=${GITHUB_WEBHOOK_SECRET:-}

      # 时区
      - TZ=Asia/Shanghai

    volumes:
      # 持久化数据
      - zclaw-data:/home/zclaw/.Zclaw
      # Agent 配置
      - ../../agents:/home/zclaw/agents:ro
      # 代码（开发模式）
      - ../../src:/home/zclaw/src:ro

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/gateway/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

    networks:
      - zclaw-network

volumes:
  zclaw-data:
    driver: local

networks:
  zclaw-network:
    driver: bridge
